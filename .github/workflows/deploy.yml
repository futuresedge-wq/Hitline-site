name: Build data and deploy
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/cache@v4
        with:
          path: .cache
          key: nhl-logs-${{ github.run_id }}
          restore-keys: nhl-logs-
      - id: pages
        uses: actions/configure-pages@v5
      - name: Build props data
        run: node scripts/build-data.mjs
        env:
          HISTORY_URL: ${{ steps.pages.outputs.base_url }}/history.json
          SPORTS: nhl,nfl,mlb
          BUILD_MINUTES: 8
          NHL_ODDS_BASE_URL: https://api.prop-line.com/v1
          NHL_ODDS_KEY: ${{ secrets.NHL_ODDS_KEY }}
          NFL_ODDS_BASE_URL: https://api.prop-line.com/v1
          NFL_ODDS_KEY: ${{ secrets.NHL_ODDS_KEY }}
          NFL_HORIZON_HOURS: 96
          MLB_ODDS_BASE_URL: https://api.prop-line.com/v1
          MLB_ODDS_KEY: ${{ secrets.NHL_ODDS_KEY }}
          MARKETS: player_goals,player_goals_2plus,player_shots_on_goal,player_blocked_shots,player_points_1plus,player_points_2plus,player_points_3plus,goalie_saves,player_pass_yds,player_pass_tds,player_rush_yds,player_reception_yds,player_receptions,player_anytime_td,player_2plus_td,batter_hits,batter_total_bases,batter_home_runs,batter_rbis,batter_runs_scored,batter_hits_runs_rbis,pitcher_strikeouts,pitcher_outs
          BOOKS: draftkings,fanduel,betmgm,betrivers,hardrock,pinnacle,betway
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
