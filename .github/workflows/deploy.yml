name: Build data and deploy
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build props data
        run: node scripts/build-data.mjs
        env:
          SPORTS: nhl
          NHL_ODDS_BASE_URL: https://api.prop-line.com/v1
          NHL_ODDS_KEY: ${{ secrets.NHL_ODDS_KEY }}
          MARKETS: player_goals,player_shots_on_goal,player_blocked_shots
          BOOKS: draftkings,fanduel,betmgm,betrivers
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
